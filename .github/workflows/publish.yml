# Publishes the UK and Glasgow maps to GitHub Pages.
# On the first run it also unpacks the uploaded repository bundle and commits it.
name: Publish map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the uploaded bundle (first publish only)
        run: |
          if ls *.zip.part-* >/dev/null 2>&1; then
            cat $(ls *.zip.part-* | sort) > /tmp/bundle.zip
            unzip -q -o /tmp/bundle.zip -d /tmp/b
            cp -a /tmp/b/uk-15-minute-walk/. ./
            rm -f *.zip.part-*
            sed -i "s/YOUR-USERNAME/${GITHUB_REPOSITORY_OWNER}/g" README.md web/index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack repository bundle"
            git push
          fi

      - name: Check there is a site to publish
        id: check
        run: |
          if [ -f web/index.html ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "Nothing to publish yet: upload the bundle parts to the repo root."; fi

      - name: Assemble the site
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p _site
          cp web/index.html web/glasgow.html _site/
          cp -r web/data _site/data

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.ready == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.check.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
